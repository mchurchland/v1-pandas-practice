[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v1-pandas-practice"
version = "0.1.0"
description = "Pandas quests with real V1 calcium and spike traces"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["pandas>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
v1_pandas_practice = ["data/*.csv"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
